version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: bash -c "python init_db.py && gunicorn --bind 0.0.0.0:5000 --timeout 120 --workers 5 --log-level debug main:app"
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://minhaqui:Xelortofu@db:5432/ufchatbot
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=minhaqui
      - POSTGRES_PASSWORD=Xelortofu
      - POSTGRES_DB=ufchatbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: